<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Circle of Fifths Quiz</title>
    <meta name="theme-color" content="#667eea" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>Circle of Fifths Quiz</h1>
      <p class="subtitle">Major Key Signatures</p>

      <div class="score-bar">
        <span id="score">Score: 0 / 0</span>
        <button id="reset-btn" class="reset-btn">Reset</button>
      </div>

      <div class="settings-bar">
        <div class="setting">
          <label for="level-select">Level</label>
          <select id="level-select">
            <option value="0">1</option>
            <option value="1">2</option>
            <option value="2">3</option>
            <option value="3">4</option>
            <option value="4">5</option>
            <option value="5">6</option>
          </select>
        </div>
        <div class="setting">
          <span class="setting-label">Mode</span>
          <div class="mode-switch" role="group" aria-label="Choose major or minor keys">
            <button class="mode-button" type="button" data-mode="major" aria-pressed="true">Major</button>
            <button class="mode-button" type="button" data-mode="minor" aria-pressed="false">Minor</button>
            <button class="mode-button" type="button" data-mode="both" aria-pressed="false">Both</button>
          </div>
        </div>
      </div>

      <div class="quiz-card">
        <div class="prompt">
          <p id="prompt-text">What is the key signature for</p>
          <h2 id="key-name" class="key-name">C Major</h2>
        </div>

        <!-- Staff / Key Signature Display -->
        <div class="staff-container">
          <svg
            id="staff-svg"
            viewBox="0 30 320 130"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!-- Staff lines -->
            <line class="staff-line" x1="20" y1="50" x2="300" y2="50" />
            <line class="staff-line" x1="20" y1="65" x2="300" y2="65" />
            <line class="staff-line" x1="20" y1="80" x2="300" y2="80" />
            <line class="staff-line" x1="20" y1="95" x2="300" y2="95" />
            <line class="staff-line" x1="20" y1="110" x2="300" y2="110" />

            <!-- Treble Clef -->
            <text
              id="treble-clef"
              x="30"
              y="120"
              font-size="100"
              font-family="Serif, 'Times New Roman', Times, Georgia, serif"
              fill="#2c3e50"
              text-anchor="middle"
            >
              𝄞
            </text>

            <!-- Key signature accidentals will be drawn here -->
            <g id="accidentals-group"></g>

            <!-- Feedback area -->
            <text
              id="staff-label"
              x="160"
              y="150"
              text-anchor="middle"
              class="staff-label"
            ></text>
          </svg>
        </div>

        <!-- Answer Buttons -->
        <div class="answers">
          <p id="answer-label" class="answer-label">
            Select all sharps/flats in this key, then click Done:
          </p>
          <div id="accidental-answers">
            <div class="btn-group">
              <p class="group-heading">Sharps</p>
              <div class="btn-row">
                <button class="toggle-btn" data-note="A♯">A♯</button>
                <button class="toggle-btn" data-note="B♯">B♯</button>
                <button class="toggle-btn" data-note="C♯">C♯</button>
                <button class="toggle-btn" data-note="D♯">D♯</button>
                <button class="toggle-btn" data-note="E♯">E♯</button>
                <button class="toggle-btn" data-note="F♯">F♯</button>
                <button class="toggle-btn" data-note="G♯">G♯</button>
              </div>
            </div>
            <div class="btn-group">
              <p class="group-heading">Flats</p>
              <div class="btn-row">
                <button class="toggle-btn" data-note="A♭">A♭</button>
                <button class="toggle-btn" data-note="B♭">B♭</button>
                <button class="toggle-btn" data-note="C♭">C♭</button>
                <button class="toggle-btn" data-note="D♭">D♭</button>
                <button class="toggle-btn" data-note="E♭">E♭</button>
                <button class="toggle-btn" data-note="F♭">F♭</button>
                <button class="toggle-btn" data-note="G♭">G♭</button>
              </div>
            </div>
          </div>
          <!-- Name-the-key pickers (built in app.js) -->
          <div id="name-answers" class="hidden"></div>
          <div class="submit-row">
            <button id="done-btn" class="done-btn">Done</button>
          </div>
        </div>

        <!-- Feedback -->
        <div id="feedback" class="feedback hidden"></div>
      </div>
    </div>

    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
      }
    </script>
  </body>
</html>
